name: Build Toolchain

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install g++-8 gcc-8 automake autoconf gettext bison flex unzip help2man libtool-bin libncurses-dev make ninja-build texinfo xz-utils gawk -y
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-8 20
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-8 20
          sudo update-alternatives --install /usr/bin/cpp cpp /usr/bin/cpp-8 20        

      - name: Build
        run: KEEP_INTERMEDIATE_STAGES=1 ./build.sh "/opt/osquery-toolchain"
